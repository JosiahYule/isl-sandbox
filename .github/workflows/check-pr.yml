name: Check website changes

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: website-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Saved fixtures and mocked providers only. Pull requests do not receive feed secrets.
      - run: npm test
